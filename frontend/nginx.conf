server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
