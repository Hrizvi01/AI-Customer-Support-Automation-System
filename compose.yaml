services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportpilot_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-supportpilot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    build: ./backend
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supportpilot}:${POSTGRES_PASSWORD:-supportpilot_local_only}@db:5432/${POSTGRES_DB:-supportpilot}
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment: *backend_environment
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend/models:/app/models
      - ./backend/data:/app/data
      - ./backend/reports:/app/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; result=json.load(urllib.request.urlopen('http://localhost:8001/api/health',timeout=8)); raise SystemExit(0 if result['database']=='ready' else 1)"]
      interval: 20s
      timeout: 10s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
